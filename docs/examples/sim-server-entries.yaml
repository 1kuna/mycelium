# DRY EXAMPLE ONLY: replace every *_PLACEHOLDER before use.
# Obtain files/size_bytes/sha256 separately for each approval with approve-local.
# Preserve the consumer's approved argv/env; qualify memory and environment first.
# Set LOOPBACK_BIND_PLACEHOLDER to the IPv4 loopback address.
# These are shared entries. Declare backend/environment needs; Mycelium chooses
# the host. A host/device restriction requires a documented hardware or approved
# production-parity exception. Project placement policy still applies.
idle_timeout: 10m
max_wait: 5m
models:
  - name: sim-chat
    project: sim
    engine: server
    platforms: [cuda]
    environment: CUDA_ARM64_ENV_PLACEHOLDER
    memory_gb: CHAT_GPU_GIB_PLACEHOLDER
    host_memory_gb: CHAT_HOST_GIB_PLACEHOLDER
    logs: none
    local_source: CHAT_APPROVAL_PLACEHOLDER
    size_bytes: CHAT_SIZE_PLACEHOLDER
    sha256: CHAT_MANIFEST_SHA256_PLACEHOLDER
    files:
      - path: CHAT_FILE_PLACEHOLDER
        size_bytes: CHAT_FILE_SIZE_PLACEHOLDER
        sha256: CHAT_FILE_SHA256_PLACEHOLDER
    start_command: [VLLM_PYTHON_PLACEHOLDER, -m, vllm.entrypoints.openai.api_server, --model, "{model_path}", --served-model-name, sim-chat, --host, LOOPBACK_BIND_PLACEHOLDER, --port, "{port}", --max-model-len, CHAT_CONTEXT_PLACEHOLDER]
    health_url: "http://localhost:{port}/health"
    env:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    # Optional, provisioned only on this worker; values never belong in YAML:
    # secret_env: {SERVICE_CREDENTIAL: CHAT_SECRET_NAME_PLACEHOLDER}

  - name: sim-glm-ocr
    project: sim
    engine: server
    platforms: [cuda]
    environment: CUDA_ARM64_ENV_PLACEHOLDER
    memory_gb: GLM_GPU_GIB_PLACEHOLDER
    host_memory_gb: GLM_HOST_GIB_PLACEHOLDER
    logs: none
    local_source: GLM_APPROVAL_PLACEHOLDER
    size_bytes: GLM_SIZE_PLACEHOLDER
    sha256: GLM_MANIFEST_SHA256_PLACEHOLDER
    files:
      - path: GLM_FILE_PLACEHOLDER
        size_bytes: GLM_FILE_SIZE_PLACEHOLDER
        sha256: GLM_FILE_SHA256_PLACEHOLDER
    start_command: [VLLM_PYTHON_PLACEHOLDER, -m, vllm.entrypoints.openai.api_server, --model, "{model_path}", --served-model-name, sim-glm-ocr, --host, LOOPBACK_BIND_PLACEHOLDER, --port, "{port}", --max-model-len, GLM_CONTEXT_PLACEHOLDER]
    health_url: "http://localhost:{port}/health"
    env:
      VLLM_WORKER_MULTIPROC_METHOD: spawn

  - name: sim-chandra
    project: sim
    engine: server
    platforms: [cuda]
    environment: CUDA_ARM64_ENV_PLACEHOLDER
    memory_gb: CHANDRA_GPU_GIB_PLACEHOLDER
    host_memory_gb: CHANDRA_HOST_GIB_PLACEHOLDER
    logs: none
    local_source: CHANDRA_APPROVAL_PLACEHOLDER
    size_bytes: CHANDRA_SIZE_PLACEHOLDER
    sha256: CHANDRA_MANIFEST_SHA256_PLACEHOLDER
    files:
      - path: CHANDRA_FILE_PLACEHOLDER
        size_bytes: CHANDRA_FILE_SIZE_PLACEHOLDER
        sha256: CHANDRA_FILE_SHA256_PLACEHOLDER
    start_command: [VLLM_PYTHON_PLACEHOLDER, -m, vllm.entrypoints.openai.api_server, --model, "{model_path}", --served-model-name, sim-chandra, --host, LOOPBACK_BIND_PLACEHOLDER, --port, "{port}", --max-model-len, CHANDRA_CONTEXT_PLACEHOLDER]
    health_url: "http://localhost:{port}/health"
    env:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
