[workspace]
name = "mycelium-gate"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
go = ">=1.25.6,<1.26"
python = "3.11.*"
uv = "*"
git = "*"

# The gate runs Go's race detector; Linux's default go package disables CGO.
# go-cgo also brings the C compiler/sysroot rather than relying on host installs.
[target.linux.dependencies]
go-cgo = ">=1.25.6,<1.26"
