[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-client"
version = "0.1.0"
description = "Python client and resumable job helpers for Mycelium"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
openai = ["openai>=1"]

[tool.setuptools.packages.find]
where = ["src"]
