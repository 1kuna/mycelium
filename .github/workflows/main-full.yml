name: main-full

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_tree:
        description: 'Authorize one recovery attempt for this full landed tree ID'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

# Replace superseded pending runs; keep started runs to avoid runner cleanup
# terminating shared helpers (#919, #1159).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    if: github.repository == '1kuna/mycelium' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mycelium-ci]
    timeout-minutes: 360
    steps:
      - name: Reserve time for gate cancellation before the job limit
        run: |
          python3 - <<'PY'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'MYCELIUM_CI_DEADLINE={time.monotonic() + 350 * 60}\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove uncovered main trees or report existing full proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYCELIUM_RECOVERY_TREE: ${{ inputs.recovery_tree }}
        run: python3 scripts/actions-full.py
      - name: Cancel any unfinished gates owned by this attempt
        if: always()
        timeout-minutes: 5
        run: python3 scripts/actions-full.py --cleanup-only
