default: mycelium-gate-full
entries:
    mycelium-gate-full:
        checks:
            result:
                - grep
                - -qx
                - 'gate full: exit=0'
                - gate-result.txt
        class: test
        environment: mycelium-gate
        name: mycelium-gate-full
        needs:
            cpu_cores: 2
            memory: auto
            platform: cpu
        outputs:
            gate-result.txt: results
        run:
            command:
                - bash
                - scripts/gate-profile.sh
            env:
                GOMAXPROCS: "2"
        source:
            git: HEAD
        targets:
            - arch: amd64
              os: linux
              platform: cpu
            - arch: arm64
              os: linux
              platform: cpu
            - arch: arm64
              os: darwin
              platform: cpu
    mycelium-go-test:
        checks:
            result:
                - grep
                - -qx
                - 'go test: exit=0'
                - go-test-result.txt
        class: test
        environment: mycelium-gate
        name: mycelium-go-test
        needs:
            cpu_cores: 2
            memory: auto
            platform: cpu
        outputs:
            go-test-log.jsonl: results
            go-test-result.txt: results
        run:
            command:
                - bash
                - scripts/go-test-profile.sh
            env:
                GOMAXPROCS: "2"
        source:
            git: HEAD
        targets:
            - arch: amd64
              os: linux
              platform: cpu
            - arch: arm64
              os: linux
              platform: cpu
            - arch: arm64
              os: darwin
              platform: cpu
project: mycelium
schema: 1
