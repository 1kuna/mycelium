# Quick retains the historical conservative 7 GiB Linux bound across selections.
# Its shared memory identity excludes selection inputs; see docs/development.md.
# Submit with --input gate-selection.tsv=FILE from scripts/gate-related.py BASE.
name: mycelium-gate-quick
project: mycelium
class: test
source:
  git: HEAD
run:
  command: [bash, scripts/gate-profile.sh, quick]
  env:
    GOMAXPROCS: '2'
needs:
  cpu_cores: 2
  memory_gb: 7
  platform: cpu
targets:
  - {os: linux, arch: amd64, platform: cpu}
  - {os: linux, arch: arm64, platform: cpu}
# Locked CPU tools for every declared target (see env/mycelium-gate/README.md).
environment: mycelium-gate
outputs:
  gate-result.txt: results
check: [grep, -qx, 'gate quick: exit=0', gate-result.txt]
