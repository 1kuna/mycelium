# Comparable accepted observations supply memory; cold configurations explore.
name: mycelium-gate-quick
project: mycelium
class: test
memory_class: per_item
source:
  git: HEAD
run:
  command: [bash, scripts/gate-profile.sh, quick]
  env:
    GOMAXPROCS: '2'
needs:
  cpu_cores: 2
  memory: auto
  platform: cpu
targets:
  - {os: linux, arch: amd64, platform: cpu}
  - {os: linux, arch: arm64, platform: cpu}
# Locked CPU tools for every declared target (see env/mycelium-gate/README.md).
environment: mycelium-gate
outputs:
  gate-result.txt: results
  gate-timings.jsonl: results
check: [grep, -qx, 'gate quick: exit=0', gate-result.txt]
