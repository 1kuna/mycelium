# Total cgroup peak plus measured range/25% margin, rounded up; see docs/development.md.
name: mycelium-gate-full
project: mycelium
class: test
source:
  git: HEAD
# Adapter source excludes its instruction file; dogfood tests need it explicitly.
inputs:
  .mycelium/adapter.yaml: .mycelium/adapter.yaml
run:
  command: [bash, scripts/gate-profile.sh]
  env:
    GOMAXPROCS: '2'
needs:
  # Fetch the pinned predecessor source during preparation; gate.sh stays offline.
  network: true
  cpu_cores: 2
  memory_gb: 6
  platform: cpu
targets:
  # CI preserves both architectures and lets Mycelium choose the worker (#527).
  - {os: linux, arch: amd64, platform: cpu}
  - {os: linux, arch: arm64, platform: cpu}
# Locked CPU tools for every declared target (see env/mycelium-gate/README.md).
environment: mycelium-gate
outputs:
  gate-result.txt: results
  gate-timings.jsonl: results
check: [grep, -qx, 'gate full: exit=0', gate-result.txt]
