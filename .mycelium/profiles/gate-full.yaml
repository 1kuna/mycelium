# Declared envelope until automatic whole-attempt memory is available (#146).
name: mycelium-gate-full
project: mycelium
class: test
source:
  git: HEAD
run:
  command: [bash, scripts/gate-profile.sh]
  env:
    GOMAXPROCS: '2'
needs:
  cpu_cores: 2
  memory_gb: 8
  platform: cpu
targets:
  - {os: linux, arch: amd64, platform: cpu}
  - {os: linux, arch: arm64, platform: cpu}
  - {os: darwin, arch: arm64, platform: cpu}
# Empty means the worker's installed toolchain, checked before the expensive run.
# A named catalog environment can supply an immutable recipe instead.
environment: {}
outputs:
  gate-result.txt: results
check: [grep, -qx, 'gate full: exit=0', gate-result.txt]
